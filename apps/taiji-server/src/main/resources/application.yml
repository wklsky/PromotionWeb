server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/taiji?useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # HS256 要求密钥 ≥256bit（32字节）；本地验证占位值，生产部署务必通过 JWT_SECRET 环境变量注入强随机值
  secret: ${JWT_SECRET:taiji-dev-secret-key-please-change-in-production-32b}
  expiration: 7200000

minio:
  endpoint: http://localhost:9000
  bucket: taiji-media
  # TODO: 生产部署前填入真实 MinIO 凭据；留空时 MediaServiceImpl 自动回退 testmock 占位
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  mock: false
