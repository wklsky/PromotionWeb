server:
  port: 8080

spring:
  datasource:
    # 安全约束：默认值一律指向本地占位，严禁在版本库中保留生产地址/账号/密码。
    # 生产部署必须通过环境变量 DB_HOST / DB_USER / DB_PASSWORD 注入真实凭据。
    url: jdbc:mysql://${DB_HOST:localhost}:3306/taiji?useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # REDIS_HOST 默认 localhost，生产部署通过环境变量注入真实地址
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # HS256 要求密钥 ≥256bit（32字节）。默认值仅为本地开发占位，非生产凭据；
  # 生产部署必须通过 JWT_SECRET 环境变量注入 ≥32 字节的强随机值（见 docs/15）。
  secret: ${JWT_SECRET:taiji-dev-secret-key-please-change-in-production-32b}
  expiration: 7200000

minio:
  endpoint: http://localhost:9000
  bucket: taiji-media
  # TODO: 生产部署前填入真实 MinIO 凭据；留空时 MediaServiceImpl 自动回退 testmock 占位
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  mock: false
